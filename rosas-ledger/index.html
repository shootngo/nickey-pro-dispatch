  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function(reg) {
          console.log('[Rosa SW] Registered, scope:', reg.scope);
        })
        .catch(function(err) {
          console.warn('[Rosa SW] Registration failed:', err);
        });
    });
  }
  </script>
