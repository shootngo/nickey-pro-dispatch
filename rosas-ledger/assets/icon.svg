<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rosa's Ledger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1018"/>
      <stop offset="100%" stop-color="#12080c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d2a8"/>
      <stop offset="100%" stop-color="#c9a07a"/>
    </linearGradient>
    <linearGradient id="rose" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#f0a3b4"/>
      <stop offset="45%" stop-color="#c45c78"/>
      <stop offset="100%" stop-color="#7a2438"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe6dc"/>
      <stop offset="100%" stop-color="#8a7a72"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.85"/>
  <!-- trailer -->
  <rect x="268" y="292" width="168" height="72" rx="8" fill="#3a1a24" stroke="url(#gold)" stroke-width="6"/>
  <rect x="280" y="304" width="144" height="28" rx="4" fill="#1a0c12" opacity="0.6"/>
  <!-- cab -->
  <path d="M168 308 h100 v70 h-72 c-8 0-14-6-18-14 l-22-40 c-4-8 0-16 12-16 z" fill="#4a1e2c" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M186 318 h54 v28 h-40 z" fill="#d4af7a" opacity="0.35"/>
  <!-- wheels -->
  <circle cx="214" cy="384" r="22" fill="#1a0c12" stroke="url(#chrome)" stroke-width="7"/>
  <circle cx="214" cy="384" r="8" fill="url(#gold)"/>
  <circle cx="318" cy="384" r="22" fill="#1a0c12" stroke="url(#chrome)" stroke-width="7"/>
  <circle cx="318" cy="384" r="8" fill="url(#gold)"/>
  <circle cx="400" cy="384" r="22" fill="#1a0c12" stroke="url(#chrome)" stroke-width="7"/>
  <circle cx="400" cy="384" r="8" fill="url(#gold)"/>
  <!-- rose -->
  <g transform="translate(150 118)">
    <path d="M86 128 c-28 18-62 8-78-18 22 4 40-8 48-28 -22-6-38-28-32-52 18 14 40 12 56-4 -4-24 10-48 36-54 -2 24 12 44 36 50 8-20 32-32 56-24 -10 22-4 46 16 62 18-8 42 0 54 22 -24 8-40 28-38 52 22 4 36 22 36 44 -26-6-50 8-62 30 4 22-12 46-36 54 -8-22-28-36-52-36 -10 20-34 32-58 26 8-22 2-46-16-62 -16 10-40 8-56-8 20-12 28-36 20-58 20 4 40-8 48-28 z" fill="url(#rose)"/>
    <circle cx="118" cy="96" r="22" fill="#7a2438"/>
    <circle cx="118" cy="96" r="10" fill="#f0d2a8" opacity="0.85"/>
  </g>
</svg>
